name: Windows

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
    - name: Check Out Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        lfs: true
    
    - name: Setup Node.js
      uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
      with:
        node-version: '20.x'

    - name: Setup Go
      uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
      with:
        go-version: '1.24.1'

    - name: Choco Install
      uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1.1.0
      with:
        choco: make awscli

    - name: Make Install
      run: make install
      continue-on-error: true

    - name: Make Build
      run: make build

    - name: Configure AWS/DigitalOcean Credentials
      uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
      with:
        aws-access-key-id: ${{ secrets.S3_UPLOAD_ID }}
        aws-secret-access-key: ${{ secrets.S3_UPLOAD_SECRET }}
        aws-region: us-east-1 # DigitalOcean Spaces requires this region

    - name: Upload to DigitalOcean
      run: |
          $files = Get-ChildItem target\YourPlace-*.exe
          foreach ($file in $files) {
            aws s3 cp $file.FullName s3://yourplace-downloads/windows/ --acl=public-read --endpoint=https://nyc3.digitaloceanspaces.com
          }

    - name: Cleanup
      run: |
        make clean
