name: OSX

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Check out repository code
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      with:
        lfs: true

    - name: Update Brew
      run: |
        brew update
        brew upgrade
        brew install make
        brew install awscli
    
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20.x'

    - name: Setup Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version: '1.25.0'

    - name: Setup Keychain and Certs
      run: |
        # Create a temporary keychain
        security create-keychain -p "${{ secrets.TEMP_KEYCHAIN_PASSWORD }}" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "${{ secrets.TEMP_KEYCHAIN_PASSWORD }}" build.keychain
        security set-keychain-settings -t 36000 -l build.keychain

    - name: Deploy Dev Signing Certs
      run: |
        mkdir -p /tmp/certs
        echo "${{ secrets.OSX_SIGNING_CERT_APPLICATION }}" | base64 -d > /tmp/certs/developerID_application.cer
        echo "${{ secrets.OSX_SIGNING_KEY_APPLICATION }}" | base64 -d > /tmp/certs/developerID_application.p12
        echo "${{ secrets.OSX_SIGNING_CERT_INSTALLER }}" | base64 -d > /tmp/certs/developerID_installer.cer
        echo "${{ secrets.OSX_SIGNING_KEY_INSTALLER }}" | base64 -d > /tmp/certs/developerID_installer.p12
        
        # Import certificates and keys
        security import /tmp/certs/developerID_application.cer -k build.keychain -T /usr/bin/codesign -T /usr/bin/productsign
        security import /tmp/certs/developerID_installer.cer -k build.keychain -T /usr/bin/codesign -T /usr/bin/productsign
        security import /tmp/certs/developerID_application.p12 -k build.keychain -P "" -T /usr/bin/codesign -T /usr/bin/productsign
        security import /tmp/certs/developerID_installer.p12 -k build.keychain -P "" -T /usr/bin/codesign -T /usr/bin/productsign
        
        # Set key partition list for the keychain
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.TEMP_KEYCHAIN_PASSWORD }}" build.keychain
        
        # Verify the certificates and identities were properly imported
        security find-identity -v -p codesigning build.keychain

    - name: Configure Notarization Tool
      run: |
        xcrun notarytool store-credentials --apple-id "nops@yourplace.network" --team-id "2NNLSL5QT4" --password "${{ secrets.OSX_NOTARY_PASSWORD }}" AustinLawrence

    - name: Install
      run: |
        make install

    - name: Build
      run: |
        make build

    - name: Configure AWS CLI for DigitalOcean Spaces
      run: |
        aws configure set aws_access_key_id ${{ secrets.S3_UPLOAD_ID }}
        aws configure set aws_secret_access_key ${{ secrets.S3_UPLOAD_SECRET }}
        aws configure set default.region us-east-1
        aws configure set default.s3.endpoint_url https://nyc3.digitaloceanspaces.com
        aws configure set default.s3.addressing_style path

    - name: Upload files to DigitalOcean Spaces
      run: |
        for file in ./target/YourPlace-*.pkg; do
          if [ -f "$file" ]; then
            echo "Uploading $file to DO Spaces..."
            aws s3 cp "$file" s3://yourplace-downloads/osx/ --acl=public-read --endpoint=https://nyc3.digitaloceanspaces.com
          fi
        done

    - name: Cleanup
      run: |
        security delete-keychain build.keychain
        rm -rf /tmp/certs
        rm -rf /tmp/cert.pem
        make clean