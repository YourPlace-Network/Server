name: Gateway Service Deploy

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: yourplace-gateway
  ECS_SERVICE: yourplace-gateway
  ECS_CLUSTER: yourplace-gateway

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::306570693158:role/gateway-github-actions
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push Docker Image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -f gateway/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Get Current Task Definition
      id: get-task-def
      run: |
        aws ecs describe-task-definition \
          --task-definition yourplace-gateway \
          --region ${{ env.AWS_REGION }} \
          --query 'taskDefinition' \
          > task-definition.json

    - name: Update Task Definition with New Image and SSH Key
      id: update-task-def
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
        SSH_PUBLIC_KEY: ${{ secrets.GATEWAY_SSH_PUBLIC_KEY }}
      run: |
        # Create new task definition with updated image and SSH public key as environment variable
        jq --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
           --arg SSH_KEY "$SSH_PUBLIC_KEY" \
           '.containerDefinitions[0].image = $IMAGE |
            .containerDefinitions[0].environment = [
              {"name": "SSH_PUBLIC_KEY", "value": $SSH_KEY}
            ] |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
           task-definition.json > new-task-definition.json

        # Register new task definition
        aws ecs register-task-definition \
          --cli-input-json file://new-task-definition.json \
          --region ${{ env.AWS_REGION }}

    - name: Update ECS Service
      run: |
        # Get the latest task definition revision that was just registered
        LATEST_TASK_DEF=$(aws ecs describe-task-definition \
          --task-definition yourplace-gateway \
          --region ${{ env.AWS_REGION }} \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)

        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service ${{ env.ECS_SERVICE }} \
          --task-definition $LATEST_TASK_DEF \
          --force-new-deployment \
          --region ${{ env.AWS_REGION }}

    - name: Wait for Service Stability
      run: |
        aws ecs wait services-stable \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_SERVICE }} \
          --region ${{ env.AWS_REGION }}
