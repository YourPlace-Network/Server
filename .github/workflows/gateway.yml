name: Windows-Gateway

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022 # Windows 10 / Server 2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '20.x'

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.24.1'

      - name: Choco Install
        uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1.1.0
        with:
          choco: make awscli

      - name: Make Clean
        run: make clean
        continue-on-error: true

      - name: Make Install
        run: make install
        continue-on-error: true

      - name: Make Build
        run: make build
