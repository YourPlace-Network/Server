name: Gateway

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: yourplace-gateway
  INSTANCE_NAME: yourplace-gateway

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::306570693158:role/gateway-github-actions
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push Docker Image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -f gateway/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Get EC2 Instance ID
      id: get-instance
      run: |
        INSTANCE_ID=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=${{ env.INSTANCE_NAME }}" \
                    "Name=instance-state-name,Values=running" \
          --query 'Reservations[0].Instances[0].InstanceId' \
          --region ${{ env.AWS_REGION }} \
          --output text)
        echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
        echo "Instance ID: $INSTANCE_ID"

    - name: Deploy to EC2
      env:
        INSTANCE_ID: ${{ steps.get-instance.outputs.instance_id }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        SSH_PUBLIC_KEY: ${{ secrets.GATEWAY_SSH_PUBLIC_KEY }}
        CLOUDFLARE_CERT_PEM: ${{ secrets.CLOUDFLARE_CERT_PEM }}
        CLOUDFLARE_CERT_KEY: ${{ secrets.CLOUDFLARE_CERT_KEY }}
      run: |
        # Base64 encode certificate and key to avoid quote escaping issues
        CERT_PEM_BASE64=$(echo "$CLOUDFLARE_CERT_PEM" | base64 -w 0)
        CERT_KEY_BASE64=$(echo "$CLOUDFLARE_CERT_KEY" | base64 -w 0)

        # Send deployment command via SSM
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids $INSTANCE_ID \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[
            \"# Configure EC2 SSH key\",
            \"mkdir -p /root/.ssh\",
            \"echo '$SSH_PUBLIC_KEY' > /root/.ssh/authorized_keys\",
            \"chmod 600 /root/.ssh/authorized_keys\",
            \"chmod 700 /root/.ssh\",
            \"# Install TLS certificate and key\",
            \"mkdir -p /opt/YourPlace\",
            \"echo '$CERT_PEM_BASE64' | base64 -d > /opt/YourPlace/cert.pem\",
            \"echo '$CERT_KEY_BASE64' | base64 -d > /opt/YourPlace/cert.key\",
            \"chmod 644 /opt/YourPlace/cert.pem\",
            \"chmod 600 /opt/YourPlace/cert.key\",
            \"# Stop and remove existing container\",
            \"docker stop yourplace-gateway || true\",
            \"docker rm yourplace-gateway || true\",
            \"# Login to ECR\",
            \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY\",
            \"# Pull latest image\",
            \"docker pull $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest\",
            \"# Run new container\",
            \"docker run -d --name yourplace-gateway --restart unless-stopped -p 443:443 -v /opt/YourPlace:/opt/YourPlace $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest\"
          ]" \
          --region ${{ env.AWS_REGION }} \
          --query 'Command.CommandId' \
          --output text)

        echo "Command ID: $COMMAND_ID"

        # Wait for command to complete (or fail)
        echo "Waiting for command to complete..."
        for i in {1..60}; do
          STATUS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID \
            --region ${{ env.AWS_REGION }} \
            --query 'Status' \
            --output text 2>/dev/null || echo "Pending")

          if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
            break
          fi

          echo "Status: $STATUS (attempt $i/60)"
          sleep 5
        done

        # Get command output
        echo "Command output:"
        aws ssm get-command-invocation \
          --command-id $COMMAND_ID \
          --instance-id $INSTANCE_ID \
          --region ${{ env.AWS_REGION }} \
          --query '[Status,StandardOutputContent,StandardErrorContent]' \
          --output text

        if [ "$STATUS" != "Success" ]; then
          echo "Deployment failed with status: $STATUS"
          exit 1
        fi

        echo "Deployment completed successfully"
