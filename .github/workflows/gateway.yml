name: Gateway

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: yourplace-gateway
  INSTANCE_NAME: yourplace-gateway

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::306570693158:role/gateway-github-actions
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push Docker Image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -f gateway/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Get EC2 Instance ID
      id: get-instance
      run: |
        INSTANCE_ID=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=${{ env.INSTANCE_NAME }}" \
                    "Name=instance-state-name,Values=running" \
          --query 'Reservations[0].Instances[0].InstanceId' \
          --region ${{ env.AWS_REGION }} \
          --output text)
        echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
        echo "Instance ID: $INSTANCE_ID"

    - name: Deploy to EC2
      env:
        INSTANCE_ID: ${{ steps.get-instance.outputs.instance_id }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        SSH_PUBLIC_KEY: ${{ secrets.GATEWAY_SSH_PUBLIC_KEY }}
        CLOUDFLARE_CERT_PEM: ${{ secrets.CLOUDFLARE_CERT_PEM }}
        CLOUDFLARE_CERT_KEY: ${{ secrets.CLOUDFLARE_CERT_KEY }}
      run: |
        # Base64 encode certificate and key
        CERT_PEM_BASE64=$(echo "$CLOUDFLARE_CERT_PEM" | base64 -w 0)
        CERT_KEY_BASE64=$(echo "$CLOUDFLARE_CERT_KEY" | base64 -w 0)

        # Create the deployment script and build JSON using jq
        DEPLOY_SCRIPT='#!/bin/bash
        set -e
        echo "=== Configuring SSH key ==="
        mkdir -p /root/.ssh
        echo "$SSH_PUBLIC_KEY" > /root/.ssh/authorized_keys
        chmod 600 /root/.ssh/authorized_keys
        chmod 700 /root/.ssh
        echo "=== Installing TLS certificates ==="
        mkdir -p /opt/YourPlace
        echo "$CERT_PEM_BASE64" | base64 -d > /opt/YourPlace/cert.pem
        echo "$CERT_KEY_BASE64" | base64 -d > /opt/YourPlace/cert.key
        chmod 644 /opt/YourPlace/cert.pem
        chmod 600 /opt/YourPlace/cert.key
        echo "=== Stopping existing container ==="
        docker stop yourplace-gateway 2>/dev/null || echo "No existing container to stop"
        docker rm yourplace-gateway 2>/dev/null || echo "No existing container to remove"
        echo "=== Logging into ECR ==="
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$ECR_REGISTRY"
        echo "=== Pulling latest image ==="
        docker pull "$ECR_REGISTRY/yourplace-gateway:latest"
        echo "=== Starting new container ==="
        docker run -d --name yourplace-gateway --restart unless-stopped -p 443:443 -v /opt/YourPlace:/opt/YourPlace "$ECR_REGISTRY/yourplace-gateway:latest"
        echo "=== Verifying container is running ==="
        docker ps | grep yourplace-gateway
        echo "=== Deployment completed successfully ==="'

        # Use jq to properly construct the JSON with all the variables and script
        jq -n \
          --arg ssh_key "$SSH_PUBLIC_KEY" \
          --arg cert_pem "$CERT_PEM_BASE64" \
          --arg cert_key "$CERT_KEY_BASE64" \
          --arg ecr_reg "$ECR_REGISTRY" \
          --arg script "$DEPLOY_SCRIPT" \
          '{
            "commands": [
              ("export SSH_PUBLIC_KEY=" + ($ssh_key | @sh)),
              ("export CERT_PEM_BASE64=" + ($cert_pem | @sh)),
              ("export CERT_KEY_BASE64=" + ($cert_key | @sh)),
              ("export ECR_REGISTRY=" + ($ecr_reg | @sh)),
              $script
            ]
          }' > /tmp/params.json

        # Send deployment command via SSM
        echo "Sending deployment command..."
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters file:///tmp/params.json \
          --region ${{ env.AWS_REGION }} \
          --output text \
          --query 'Command.CommandId')

        echo "Command ID: $COMMAND_ID"

        # Wait for command to complete
        echo "Waiting for command to complete..."
        aws ssm wait command-executed \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --region ${{ env.AWS_REGION }} \
          2>&1 || true

        # Get detailed command output
        echo ""
        echo "=== Command Results ==="
        RESULT=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --region ${{ env.AWS_REGION }} \
          --output json)

        STATUS=$(echo "$RESULT" | jq -r '.Status')
        echo "Status: $STATUS"

        echo ""
        echo "=== Standard Output ==="
        echo "$RESULT" | jq -r '.StandardOutputContent'

        echo ""
        echo "=== Standard Error ==="
        echo "$RESULT" | jq -r '.StandardErrorContent'

        if [ "$STATUS" != "Success" ]; then
          echo ""
          echo "ERROR: Deployment failed with status: $STATUS"
          exit 1
        fi

        echo ""
        echo "SUCCESS: Deployment completed successfully"
